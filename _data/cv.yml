cv:
  name: Jie (Jay) Yuan
  label: Machine Learning Scientist · Computational Biologist
  email: jay.yuan@gmail.com
  location: Arlington, VA
  image: ""
  summary: >-
    Machine learning scientist with a PhD in computer science and 5+ years of experience designing and implementing advanced statistical models
    and computational pipelines for large-scale biological datasets. Specializes in Bayesian modeling, spatial omics, multi-omics integration,
    next-generation sequencing pipelines, microbiome analysis, NMR data processing and analysis, and ML engineering. Broadly interested in
    machine learning, statistical genomics, genome-wide association, problems in spatial analysis and geometry, and interactive data visualization.

  social_networks:
    - network: GitHub
      username: jyuan1322

  sections:
    Experience:
      - company: Brigham and Women's Hospital / Harvard Medical School
        position: Machine Learning Scientist
        start_date: 2025-05
        end_date: 2026-07
        summary: "Advisor: Georg Gerber"
        highlights:
          - >-
            Built preprocessing, calibration, and Bayesian (Stan) modeling pipelines to characterize C. difficile metabolic dynamics (dFBA, COBRApy)
            from real-time NMR spectroscopy data, with uncertainty propagated into flux estimates, cutting analysis time from 2 weeks to 6 hours.
          - >-
            Built reproducible multi-omics pipelines for microbiome cohorts (16S, shotgun metagenomics, NMR metabolomics, proteomics) parallelized on a
            SLURM cluster, and a Python ML framework with shared modeling code across assays and dynamic handling of clinical covariates.
          - >-
            Provided metagenomic and 16S microbiome data analysis and consultation for external collaborating labs from raw sequencing data (DADA2,
            phyloseq, MetaPhlAn, HUMAnN), and presented statistical findings to non-technical audiences.

      - company: Yale School of Medicine
        position: Research Scientist
        start_date: 2024-07
        end_date: 2025-05
        summary: "Advisor: Xianjun Dong (moved with the lab from Brigham and Women's Hospital)"
        highlights:
          - >-
            Led computational development of a multi-omic spatial and temporal cell atlas of Parkinson's disease pathology (manuscript in
            preparation), integrating spatial transcriptomic and single-cell data across disease stages. Analyses included annotation (clustering,
            batch correction, dimensionality reduction), differential expression (various regression methods), and single-cell/spatial
            deconvolution for data integration.
          - >-
            Developed a machine learning tool to infer nonlinear boundaries between brain cortical layers from highly noisy 10x Visium spatial data,
            solving a previously manual and error-prone analytical bottleneck.
          - Built a web application for manual selection and filtering of spots falling under spatial artifacts, streamlining a previously manual QC step.
          - Managed lab compute infrastructure, including server administration, HPC job scheduling, and IT support.

      - company: Brigham and Women's Hospital / Harvard Medical School
        position: Postdoctoral Research Fellow
        start_date: 2021-02
        end_date: 2024-06
        summary: "Advisors: Xianjun Dong and Clemens Scherzer"
        highlights:
          - Carried out early Visium spatial data analysis for the Parkinson's disease cell atlas.
          - >-
            Implemented variational graph autoencoder-based integration methods for hexagonally arranged spatial data to build a joint model across
            heterogeneous omics data types.
          - >-
            Conducted Gaussian process time-series analysis of bulk blood gene expression in ~600 Parkinson's patients across longitudinal clinical
            visits using Stan, as part of the AMP-PD consortium.

